
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam Prep Tracker</title>
<style>
:root{color-scheme:light;--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667085;--bd:#e3e6ee;--ac:#3b5bdb;--ok:#2f9e44;--no:#e03131;--wa:#e8890c}
:root[data-theme=dark]{color-scheme:dark;--bg:#12141a;--card:#1c1f28;--tx:#e8eaf0;--mu:#9aa1b2;--bd:#2b3040;--ac:#7c93ff;--ok:#51cf66;--no:#ff6b6b;--wa:#ffa94d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:18px;margin:0}h2{font-size:20px}
nav{display:flex;flex-direction:column;gap:6px;padding:14px 10px}
.workspace{display:flex;align-items:flex-start;min-height:calc(100vh - 66px)}
.sidebar{flex:0 0 220px;min-height:calc(100vh - 66px);background:var(--card);border-right:1px solid var(--bd)}
.nav-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.nav-icon{width:24px;text-align:center;font-size:18px}
main{flex:1;min-width:0;max-width:1100px;margin:0 auto;padding:12px 20px 40px}
header .row{gap:8px}
.profile{display:flex;align-items:center;gap:9px;padding-left:10px;border-left:1px solid var(--bd)}
.profile-avatar{width:40px;height:40px;position:relative;display:grid;place-items:center;flex:0 0 40px;border-radius:50%;overflow:hidden;background:var(--ac);color:#fff;font-weight:700}
.profile-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.profile-copy{min-width:0;max-width:180px}
.profile-copy strong,.profile-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-copy span{font-size:12px;color:var(--mu)}
.profile-actions{display:flex;gap:4px;align-items:center}
.profile-actions button{padding:6px 8px;font-size:12px}
.section-title{margin:8px 2px;font-size:16px}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:white}
button.on .nav-icon{filter:grayscale(1) brightness(10)}
button.del{color:var(--no)}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px;margin:4px 0 10px}
label{font-size:13px;color:var(--mu);display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat b{display:block;font-size:25px}.stat span,.mu{font-size:13px;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input.flex{flex:1;min-width:130px}
.tag{font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:20px;padding:2px 8px}

pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
code,textarea.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
hr{border:0;border-top:1px solid var(--bd);margin:12px 0}
#sync{font-size:12px;color:var(--mu)}

.notes-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.notes-toolbar h2{margin:4px 0}
.note-card{padding:0;overflow:hidden}
.note-card-header{padding:16px 18px 10px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 10%,var(--card)),var(--card))}
.note-card-header h3{margin:0;font-size:17px;overflow-wrap:anywhere}
.note-card-body{padding:0 18px 16px}
.note-content{margin:6px 0 12px;white-space:normal;overflow-wrap:anywhere;line-height:1.7}
.note-content.preview{max-height:9em;overflow:hidden;mask-image:linear-gradient(#000 78%,transparent)}
.note-content h1,.note-content h2,.note-content h3{margin:12px 0 6px;line-height:1.3}
.note-content ul,.note-content ol{padding-left:25px}
.note-content blockquote{margin:10px 0;padding:8px 12px;border-left:4px solid var(--ac);background:var(--bg)}
.note-content mark{padding:1px 3px;border-radius:3px}
.note-content table{width:100%;border-collapse:collapse;margin:10px 0}
.note-content th,.note-content td{border:1px solid var(--bd);padding:7px;text-align:left}
.note-content pre{white-space:pre-wrap}
.note-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px}
.note-editor{border-color:color-mix(in srgb,var(--ac) 35%,var(--bd))}
.note-format-toolbar{position:sticky;top:8px;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 0;padding:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 3px 12px #0002}
.note-format-toolbar button{min-width:36px;padding:7px 10px;font-size:13px}
.note-format-toolbar select{width:auto;min-width:76px;margin:0;padding:7px}
.note-rich-editor{min-height:300px;padding:18px;margin:0 0 12px;border:1px solid var(--bd);border-radius:0 0 10px 10px;background:var(--card);outline:none;line-height:1.75;overflow-wrap:anywhere}
.note-rich-editor:focus{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 15%,transparent)}
.note-rich-editor:empty:before{content:attr(data-placeholder);color:var(--mu);pointer-events:none}
.note-rich-editor h1,.note-rich-editor h2,.note-rich-editor h3{margin:12px 0 6px}
.note-rich-editor ul,.note-rich-editor ol{padding-left:25px}
.note-rich-editor blockquote{margin:10px 0;padding:8px 12px;border-left:4px solid var(--ac);background:var(--bg)}
.note-rich-editor table{width:100%;border-collapse:collapse;margin:10px 0}
.note-rich-editor th,.note-rich-editor td{border:1px solid var(--bd);padding:7px}
.note-content img,.note-rich-editor img{display:block;max-width:100%;height:auto;margin:10px 0;border-radius:8px}
.note-format-toolbar label{display:flex;align-items:center;gap:5px;padding:0 4px;color:var(--tx);font-size:12px}
.note-format-toolbar input[type=color]{width:34px;height:34px;margin:0;padding:2px;cursor:pointer}
.note-format-toolbar input:focus-visible,.note-format-toolbar select:focus-visible,.note-format-toolbar button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.note-empty{text-align:center;padding:34px 18px}
@media(max-width:700px){
  header{align-items:flex-start}
  header>.row{justify-content:flex-end;flex:1}
  .sidebar{flex-basis:190px}
  main{padding:10px 12px 30px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
  .stat b{font-size:21px}
  .note-card-header,.note-card-body{padding-left:14px;padding-right:14px}
}
@media(max-width:520px){
  .workspace{display:block}
  .sidebar{min-height:0;border-right:0;border-bottom:1px solid var(--bd)}
  nav{gap:4px;padding:8px;max-height:270px;overflow-y:auto}
  .nav-link{padding:7px 9px}
  header .row{justify-content:flex-start}
  .profile-copy{max-width:120px}
  main{padding:8px 10px 28px}
}
</style>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

/* ---------- FIREBASE CONFIGURATION ---------- */

const firebaseConfig = {
  apiKey: "AIzaSyDowpYuRY0fCVdecHoI73WI5eFyjcHge1Q",
  authDomain: "exam-prep-tracker-81cd5.firebaseapp.com",
  projectId: "exam-prep-tracker-81cd5",
  storageBucket: "exam-prep-tracker-81cd5.firebasestorage.app",
  messagingSenderId: "41721142555",
  appId: "1:41721142555:web:57fb43f7b211e3dfb907be",
  measurementId: "G-6SQQMMKTS5"

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);

/* ---------- APP STATE ---------- */

let S = {exams:[], questions:[], codingQuestions:[], notes:[]};
let view = "dash";
let user = null;
let loading = false;
let saveTimer = null;
let syncVersion = 0;
let editId = null;
let codingEditId = null;
let codingPre = null;
let codingDraft = null;
let pre = null;
let questionTopicFocus = null;
let noteEditId = null;
let noteEditorOpen = false;
let noteSelectionRange = null;
let noteSearch = "";
let expandedNotes = new Set();
let bulkQuestions = [];
let practice = {ids:[], index:0, picked:null};
let filter = {exam:"", chapter:"", topic:"", status:"", q:""};
let revisionFilter = {exam:"", chapter:"", topic:""};
let dialogAction = null;
let driveAccessToken = null;
let driveTokenExpiresAt = 0;
let driveSaveQueue = Promise.resolve();
const authStateWaiters = [];
const DRIVE_FILE_NAME = "ExamPrepData.json";
const uid = () => crypto.randomUUID
  ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Date.now();
const DEVICE_ID_KEY = "examPrep_deviceId";
const DEVICE_ID = (() => {
  try {
    let id = localStorage.getItem(DEVICE_ID_KEY);
    if(!id) {
      id = uid();
      localStorage.setItem(DEVICE_ID_KEY,id);
    }
    return id;
  } catch(e) {
    console.warn("Device sync ID could not be persisted:",e);
    return uid();
  }
})();
const EMPTY_DELETIONS = {
  exams:[],chapters:[],topics:[],questions:[],codingQuestions:[],notes:[]
};

const TABS = [
  ["dash","Dashboard","🏠"],["exams","My Exams","📚"],
  ["add","Add Question","➕"],["bank","Question Bank","🗂️"],
  ["prac","Practice","✍️"],["rev","Revision","🔁"],
  ["coding","Coding","💻"],["codeRev","Code Revision","🧠"],["notes","Notes","📝"],
  ["set","Settings","⚙️"]
];
const CODE_LANGUAGES = [
  ["cpp","C++"],["java","Java"],["python","Python"],["javascript","JavaScript"]
];

const $ = id => document.getElementById(id);

const esc = value => {
  const d = document.createElement("div");
  d.textContent = value == null ? "" : String(value);
  return d.innerHTML;
};

const NOTE_TAGS = new Set([
  "P","DIV","BR","STRONG","B","EM","I","U","H1","H2","H3","UL","OL","LI",
  "BLOCKQUOTE","PRE","CODE","HR","SPAN","MARK","TABLE","THEAD",
  "TBODY","TR","TH","TD","A","IMG"
]);

function sanitizeNoteHtml(html, {allowLargeImages = false} = {}) {
  const parsed = new DOMParser().parseFromString(String(html || ""), "text/html");
  const blocked = new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","SVG","MATH","VIDEO","AUDIO","FORM"]);
  const clean = node => {
    [...node.childNodes].forEach(child => {
      if(child.nodeType !== Node.ELEMENT_NODE) {
        if(child.nodeType !== Node.TEXT_NODE) child.remove();
        return;
      }
      if(blocked.has(child.tagName)) { child.remove(); return; }
      clean(child);
      if(!NOTE_TAGS.has(child.tagName)) {
        child.replaceWith(...child.childNodes);
        return;
      }
      [...child.attributes].forEach(attr => {
        if(child.tagName === "A" && attr.name === "href" && /^https?:\/\//i.test(attr.value)) return;
        if(child.tagName === "A" && attr.name === "title") return;
        if(child.tagName === "IMG" && attr.name === "src" &&
          (/^data:image\/(?:jpeg|png|webp|gif);base64,[A-Za-z0-9+/]+={0,2}$/.test(attr.value) &&
            attr.value.length <= (allowLargeImages ? 14*1024*1024 : 250000) ||
            /^https:\/\//i.test(attr.value))) return;
        if(child.tagName === "IMG" && attr.name === "alt") return;
        if(child.tagName === "TH" || child.tagName === "TD") {
          if((attr.name === "colspan" || attr.name === "rowspan") &&
            /^[1-9]\d?$/.test(attr.value)) return;
          if(attr.name === "scope" && ["row","col","rowgroup","colgroup"].includes(attr.value)) return;
        }
        if(attr.name === "style" &&
          ["SPAN","P","DIV","H1","H2","H3","LI","BLOCKQUOTE","TABLE","THEAD","TBODY","TR","TH","TD"].includes(child.tagName)) {
          const safe = [];
          const color = child.style.color;
          const background = child.style.backgroundColor;
          const fontSize = child.style.fontSize;
          const textAlign = child.style.textAlign;
          if(color && CSS.supports("color",color)) safe.push(`color:${color}`);
          if(background && CSS.supports("background-color",background)) safe.push(`background-color:${background}`);
          if(/^(?:[8-9]|[1-4]\d|50)px$/.test(fontSize)) safe.push(`font-size:${fontSize}`);
          if(["left","center","right","justify"].includes(textAlign)) safe.push(`text-align:${textAlign}`);
          const width = child.style.width;
          if(/^(?:\d{1,3}(?:\.\d+)?%|\d{1,4}px)$/.test(width)) safe.push(`width:${width}`);
          if(safe.length) child.setAttribute("style",safe.join(";"));
          else child.removeAttribute("style");
          return;
        }
        child.removeAttribute(attr.name);
      });
      if(child.tagName === "A") child.setAttribute("rel","noopener noreferrer");
      if(child.tagName === "IMG") {
        if(!child.hasAttribute("src")) child.remove();
        else {
          child.setAttribute("referrerpolicy","no-referrer");
          child.setAttribute("loading","lazy");
        }
      }
    });
  };
  clean(parsed.body);
  return parsed.body.innerHTML;
}

function formatNoteContent(content) {
  const value = String(content || "");
  if(/<(p|br|h[1-3]|ul|ol|li|strong|b|em|i|u|blockquote|pre|code|table|div|span|hr|mark|img)\b/i.test(value))
    return sanitizeNoteHtml(value);
  return value.split(/\r?\n/).map(line => `<p>${line ? esc(line) : "<br>"}</p>`).join("");
}

function notePlainText(content) {
  const box = document.createElement("div");
  box.innerHTML = formatNoteContent(content);
  box.querySelectorAll("img").forEach(image=>image.remove());
  return (box.textContent || "").replace(/\s+/g," ").trim();
}

const accountKey = uidValue => "examPrep_" + uidValue;
function setSync(text){ $("sync").textContent = text; }

function message(text, onOK = null) {
  dialogAction = onOK;
  $("dlg").innerHTML = `
    <div class="card">
      <p>${esc(text)}</p>
      <div class="row" style="justify-content:flex-end">
        <button onclick="closeDialog()">OK</button>
      </div>
    </div>`;
  $("dlg").style.display = "flex";
}

function waitForAuthUser(owner) {
  if(user?.uid===owner) return Promise.resolve();
  return new Promise(resolve => authStateWaiters.push({owner,resolve}));
}

function confirmAction(text, callback) {
  dialogAction = callback;
  $("dlg").innerHTML = `
    <div class="card">
      <p>${esc(text)}</p>
      <div class="row" style="justify-content:flex-end">
        <button onclick="closeDialog()">Cancel</button>
        <button class="pri" onclick="confirmDialog()">Confirm</button>
      </div>
    </div>`;
  $("dlg").style.display = "flex";
}

window.closeDialog = () => {
  $("dlg").style.display = "none";
  dialogAction = null;
};
window.confirmDialog = () => {
  const fn = dialogAction;
  window.closeDialog();
  if(fn) fn();
};

/* ---------- LOCAL + GOOGLE DRIVE STORAGE ---------- */

function saveLocal() {
  if(!user) return;
  saveLocalFor(user.uid,S);
}

function saveLocalFor(owner,data) {
  try {
    localStorage.setItem(accountKey(owner),JSON.stringify(data));
  } catch(e) {
    console.warn("Local save failed",e);
    setSync("Local storage full; backup recommended");
  }
}

function readLocal(key) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : null;
  } catch(e) {
    return null;
  }
}

function validData(data) {
  return data && Array.isArray(data.exams) &&
    Array.isArray(data.questions);
}

function normalizeData(data) {
  if(!validData(data)) return {exams:[],questions:[],codingQuestions:[],notes:[]};
  if(!Array.isArray(data.codingQuestions)) data.codingQuestions = [];
  if(!Array.isArray(data.notes)) data.notes = [];
  data.deleted = data.deleted && typeof data.deleted==="object" ? data.deleted : {};
  Object.keys(EMPTY_DELETIONS).forEach(type=>{
    if(!Array.isArray(data.deleted[type])) data.deleted[type] = [];
  });
  if(typeof data.profilePhoto !== "string" || !data.profilePhoto.startsWith("data:image/jpeg;base64,"))
    data.profilePhoto = "";

  data.exams.forEach(e => {
    if(!Array.isArray(e.chapters)) e.chapters = [];
    e.chapters.forEach(c => {
      if(!Array.isArray(c.topics)) c.topics = [];
      c.topics.forEach(t => {
        if(typeof t.notes !== "string") t.notes = "";
      });
    });
  });

  data.questions.forEach(q => {
    q.opts = Array.isArray(q.opts) ? q.opts : ["","","",""];
    while(q.opts.length < 4) q.opts.push("");
    q.attempts = Number(q.attempts || 0);
    q.correct = Number(q.correct || 0);
    q.wrong = Number(q.wrong || 0);
    q.bm = !!q.bm;
    q.revise = !!q.revise;
    if(!q.progressByDevice || typeof q.progressByDevice!=="object" ||
      (!Object.keys(q.progressByDevice).length && q.attempts)) {
      q.progressByDevice = {
        legacy:{
          attempts:q.attempts,correct:q.correct,wrong:q.wrong,
          last:q.last||null,lastOk:!!q.lastOk,lastAttemptAt:Number(q.updatedAt||0)
        }
      };
    }
    Object.values(q.progressByDevice).forEach(progress=>{
      progress.attempts = Math.max(0,Number(progress.attempts)||0);
      progress.correct = Math.max(0,Number(progress.correct)||0);
      progress.wrong = Math.max(0,Number(progress.wrong)||0);
      progress.last = progress.last||null;
      progress.lastOk = !!progress.lastOk;
      progress.lastAttemptAt = Math.max(0,Number(progress.lastAttemptAt)||0);
    });
    updateQuestionProgress(q);
  });

  data.codingQuestions = data.codingQuestions.filter(q => q && typeof q === "object");
  data.codingQuestions.forEach(q => {
    q.title = String(q.title || "");
    q.prompt = String(q.prompt || "");
    q.constraints = String(q.constraints || "");
    q.conceptNotes = String(q.conceptNotes || "");
    q.solutions = q.solutions && typeof q.solutions === "object" ? q.solutions : {};
    CODE_LANGUAGES.forEach(([id]) => {
      if(typeof q.solutions[id] !== "string") q.solutions[id] = "";
    });
    q.testCases = Array.isArray(q.testCases) ? q.testCases : [];
    q.testCases = q.testCases.map(testCase => ({
      input:String(testCase?.input ?? ""),
      expected:String(testCase?.expected ?? "")
    }));
    q.revise = !!q.revise;
  });

  data.notes = data.notes.filter(note => note && typeof note === "object");
  data.notes.forEach(note => {
    note.id = String(note.id || uid());
    note.title = String(note.title || "");
    note.content = String(note.content || "");
    note.category = String(note.category || "");
    note.createdAt = Number(note.createdAt || note.updatedAt || Date.now());
    note.updatedAt = Number(note.updatedAt || note.createdAt);
  });

  return data;
}

function updateQuestionProgress(question) {
  const entries = Object.values(question.progressByDevice||{});
  question.attempts = entries.reduce((total,item)=>total+item.attempts,0);
  question.correct = entries.reduce((total,item)=>total+item.correct,0);
  question.wrong = entries.reduce((total,item)=>total+item.wrong,0);
  const latest = entries.reduce((winner,item)=>
    Number(item.lastAttemptAt||0)>Number(winner?.lastAttemptAt||0) ? item : winner,null);
  if(latest) {
    question.last = latest.last;
    question.lastOk = !!latest.lastOk;
  } else if(!question.attempts) {
    question.last = null;
    question.lastOk = false;
  }
}

function questionAttemptCount(question) {
  const recorded = Object.values(question.progressByDevice||{})
    .reduce((total,progress)=>total+(Number(progress?.attempts)||0),0);
  return Math.max(Number(question.attempts)||0,recorded);
}

function mergeRecords(localRecords,remoteRecords,mergeNested) {
  const localById = new Map(localRecords.map(record=>[record.id,record]));
  const remoteById = new Map(remoteRecords.map(record=>[record.id,record]));
  const ids = new Set([...remoteById.keys(),...localById.keys()]);
  return [...ids].map(id=>{
    const localRecord = localById.get(id);
    const remoteRecord = remoteById.get(id);
    let record;
    if(!localRecord) record = {...remoteRecord};
    else if(!remoteRecord) record = {...localRecord};
    else {
      const localTime = Number(localRecord.updatedAt||0);
      const remoteTime = Number(remoteRecord.updatedAt||0);
      record = {...(localTime>=remoteTime?remoteRecord:localRecord),
        ...(localTime>=remoteTime?localRecord:remoteRecord)};
      if(mergeNested) record = mergeNested(localRecord,remoteRecord,record);
    }
    return record;
  });
}

function mergeData(localData,remoteData) {
  const local = normalizeData(JSON.parse(JSON.stringify(localData)));
  const remote = normalizeData(JSON.parse(JSON.stringify(remoteData)));
  const merged = {...remote,...local};
  merged.deleted = {};
  Object.keys(EMPTY_DELETIONS).forEach(type=>{
    merged.deleted[type] = [...new Set([
      ...remote.deleted[type],...local.deleted[type]
    ])];
  });

  merged.exams = mergeRecords(local.exams,remote.exams,(localExam,remoteExam,exam)=>{
    exam.chapters = mergeRecords(localExam.chapters||[],remoteExam.chapters||[],
      (localChapter,remoteChapter,chapter)=>{
        chapter.topics = mergeRecords(localChapter.topics||[],remoteChapter.topics||[]);
        return chapter;
      });
    return exam;
  }).filter(exam=>!merged.deleted.exams.includes(exam.id));

  const deletedChapters = new Set(merged.deleted.chapters);
  const deletedTopics = new Set(merged.deleted.topics);
  merged.exams.forEach(exam=>{
    exam.chapters = exam.chapters.filter(chapter=>!deletedChapters.has(chapter.id));
    exam.chapters.forEach(chapter=>{
      chapter.topics = chapter.topics.filter(topic=>!deletedTopics.has(topic.id));
    });
  });

  merged.questions = mergeRecords(local.questions,remote.questions,(localQuestion,remoteQuestion,question)=>{
    question.progressByDevice = {...remoteQuestion.progressByDevice};
    Object.entries(localQuestion.progressByDevice||{}).forEach(([deviceId,progress])=>{
      const existing = question.progressByDevice[deviceId];
      if(!existing) question.progressByDevice[deviceId] = {...progress};
      else {
        const newest = Number(progress.lastAttemptAt||0)>Number(existing.lastAttemptAt||0)
          ? progress : existing;
        question.progressByDevice[deviceId] = {
          attempts:Math.max(existing.attempts,progress.attempts),
          correct:Math.max(existing.correct,progress.correct),
          wrong:Math.max(existing.wrong,progress.wrong),
          last:newest.last||null,lastOk:!!newest.lastOk,
          lastAttemptAt:Math.max(Number(existing.lastAttemptAt||0),Number(progress.lastAttemptAt||0))
        };
      }
    });
    updateQuestionProgress(question);
    return question;
  }).filter(question=>!merged.deleted.questions.includes(question.id) &&
    !merged.deleted.exams.includes(question.examId) &&
    !merged.deleted.chapters.includes(question.chapterId) &&
    !merged.deleted.topics.includes(question.topicId));

  merged.codingQuestions = mergeRecords(local.codingQuestions,remote.codingQuestions)
    .filter(question=>!merged.deleted.codingQuestions.includes(question.id) &&
      !merged.deleted.exams.includes(question.examId) &&
      !merged.deleted.chapters.includes(question.chapterId) &&
      !merged.deleted.topics.includes(question.topicId));

  merged.notes = mergeRecords(local.notes,remote.notes)
    .filter(note=>!merged.deleted.notes.includes(note.id));

  merged.updated = Math.max(Number(local.updated||0),Number(remote.updated||0));
  const localPhotoTime = Number(local.profilePhotoUpdatedAt||0);
  const remotePhotoTime = Number(remote.profilePhotoUpdatedAt||0);
  if(remotePhotoTime>localPhotoTime) {
    merged.profilePhoto = remote.profilePhoto;
    merged.profilePhotoUpdatedAt = remotePhotoTime;
  } else {
    merged.profilePhoto = local.profilePhoto;
    merged.profilePhotoUpdatedAt = localPhotoTime;
  }
  return normalizeData(merged);
}

function markDeleted(type,id) {
  if(!S.deleted || !Array.isArray(S.deleted[type])) {
    S.deleted = Object.fromEntries(Object.entries(EMPTY_DELETIONS)
      .map(([key,ids])=>[key,[...ids]]));
  }
  if(!S.deleted[type].includes(id)) S.deleted[type].push(id);
}

function stamp(record) {
  if(record) record.updatedAt = Date.now();
}

function recordQuestionAttempt(question,correct) {
  if(!question.progressByDevice || typeof question.progressByDevice!=="object") {
    question.progressByDevice = {
      legacy:{
        attempts:Number(question.attempts||0),correct:Number(question.correct||0),
        wrong:Number(question.wrong||0),last:question.last||null,
        lastOk:!!question.lastOk,lastAttemptAt:Number(question.updatedAt||0)
      }
    };
  }
  const progress = question.progressByDevice[DEVICE_ID] ||
    (question.progressByDevice[DEVICE_ID]={attempts:0,correct:0,wrong:0,last:null,lastOk:false,lastAttemptAt:0});
  const timestamp = Date.now();
  progress.attempts++;
  if(correct) progress.correct++;
  else progress.wrong++;
  progress.last = new Date(timestamp).toISOString().slice(0,10);
  progress.lastOk = correct;
  progress.lastAttemptAt = timestamp;
  updateQuestionProgress(question);
  stamp(question);
}

function driveTokenValid() {
  return !!driveAccessToken && Date.now() < driveTokenExpiresAt;
}

function updateDriveButtons() {
  const signedIn = !!user;
  const connected = signedIn && driveTokenValid();
  $("driveConnect").hidden = !signedIn || connected;
  $("driveSync").hidden = !connected;
}

async function driveRequest(url,options={}) {
  if(!driveTokenValid()) {
    driveAccessToken = null;
    updateDriveButtons();
    throw new Error("Google Drive connection expired. Reconnect Google Drive to sync.");
  }

  const response = await fetch(url,{
    ...options,
    headers:{
      ...(options.headers||{}),
      Authorization:"Bearer "+driveAccessToken
    }
  });

  if(response.status===401) {
    driveAccessToken = null;
    driveTokenExpiresAt = 0;
    updateDriveButtons();
    throw new Error("Google Drive authorization expired. Reconnect Google Drive to sync.");
  }
  if(!response.ok) {
    const detail = await response.text();
    const error = new Error(`Google Drive request failed (${response.status}): ${detail}`);
    error.status = response.status;
    throw error;
  }
  return response;
}

async function findDriveFile() {
  const params = new URLSearchParams({
    q:`name = '${DRIVE_FILE_NAME}' and mimeType = 'application/json' and trashed = false`,
    orderBy:"modifiedTime desc",
    pageSize:"100",
    fields:"files(id,name,modifiedTime)"
  });
  const response = await driveRequest(
    `https://www.googleapis.com/drive/v3/files?${params.toString()}`
  );
  const result = await response.json();
  return result.files?.[0] || null;
}

async function writeDriveFile(data,fileId=null,etag=null) {
  const boundary = "----ExamPrepTracker"+uid().replace(/[^a-zA-Z0-9]/g,"");
  const metadata = {name:DRIVE_FILE_NAME,mimeType:"application/json"};
  const body = [
    `--${boundary}`,
    "Content-Type: application/json; charset=UTF-8",
    "",
    JSON.stringify(metadata),
    `--${boundary}`,
    "Content-Type: application/json; charset=UTF-8",
    "",
    JSON.stringify(data),
    `--${boundary}--`,
    ""
  ].join("\r\n");
  const endpoint = fileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(fileId)}?uploadType=multipart`
    : "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
  await driveRequest(endpoint,{
    method:fileId?"PATCH":"POST",
    headers:{
      "Content-Type":`multipart/related; boundary=${boundary}`,
      ...(fileId&&etag?{"If-Match":etag}:{})
    },
    body
  });
}

async function migrateLegacyFirestore(owner) {
  const snapshot = await getDoc(doc(db,"userData",owner));
  if(!snapshot.exists() || !validData(snapshot.data().state)) return null;
  return normalizeData(snapshot.data().state);
}

async function syncDriveData(firebaseUser) {
  if(!driveTokenValid()) throw new Error("Connect Google Drive before syncing.");
  const owner = firebaseUser.uid;
  if(auth.currentUser?.uid!==owner) return;

  setSync("Checking Google Drive...");
  const accountLocal = readLocal(accountKey(owner));
  const oldLocal = validData(accountLocal) ? null : readLocal("examprep");
  const local = normalizeData(validData(accountLocal) ? accountLocal :
    validData(oldLocal) ? oldLocal : {exams:[],questions:[],codingQuestions:[],notes:[]});
  const file = await findDriveFile();

  if(file) {
    S = await mergeWithDriveFile(local,file);
    saveLocalFor(owner,S);
    setSync("☁️ Google Drive merged and synced");
    return;
  }

  let legacy;
  try {
    legacy = await migrateLegacyFirestore(owner);
  } catch(e) {
    console.error("Legacy Firestore migration failed:",e);
    throw new Error("Could not check your old Firebase backup. It was not changed; check Firestore permissions and try again.");
  }

  S = legacy ? mergeData(local,legacy) : local;
  if(!S.updated) S.updated = Date.now();
  const created = await mergeWithDriveFile(S,null);
  S = created;
  saveLocalFor(owner,S);
  setSync(legacy
    ? "☁️ Old Firebase and local data merged into Google Drive"
    : "☁️ Local data saved to Google Drive");
}

async function mergeWithDriveFile(localSnapshot,fileHint) {
  let file = fileHint;
  for(let attempt=0;attempt<4;attempt++) {
    if(attempt>0 || !file) file = await findDriveFile();
    let remote = {exams:[],questions:[],codingQuestions:[],notes:[]};
    let etag = null;
    if(file) {
      const response = await driveRequest(
        `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(file.id)}?alt=media`
      );
      etag = response.headers?.get("ETag") || null;
      try {
        remote = await response.json();
      } catch(e) {
        throw new Error("Drive backup is not valid JSON. Local data was left unchanged.");
      }
      if(!validData(remote))
        throw new Error("Drive backup format is invalid. Local data was left unchanged.");
    }

    const merged = mergeData(localSnapshot,remote);
    merged.updated = Date.now();
    try {
      await writeDriveFile(merged,file?.id||null,etag);
      return merged;
    } catch(e) {
      if(e.status!==412 || attempt===3) throw e;
    }
  }
  throw new Error("Drive data changed repeatedly during sync. Please try Sync now again.");
}

function scheduleSave() {
  S.updated = Date.now();
  saveLocal();

  if(!user || loading) return;
  if(!driveTokenValid()) {
    setSync("Saved on this device; connect Google Drive to sync");
    updateDriveButtons();
    return;
  }

  clearTimeout(saveTimer);
  const version = ++syncVersion;
  setSync("Saving to Google Drive...");

  saveTimer = setTimeout(async () => {
    if(!user || loading || version !== syncVersion || !driveTokenValid()) return;
    const firebaseUser = user;
    const snapshot = JSON.parse(JSON.stringify(S));

    driveSaveQueue = driveSaveQueue.then(async () => {
      if(!user || user.uid!==firebaseUser.uid || loading || version!==syncVersion) return;
      if(!driveTokenValid()) {
        setSync("Saved on this device; reconnect Google Drive to sync");
        updateDriveButtons();
        return;
      }
      const merged = await mergeWithDriveFile(snapshot,null);
      if(user?.uid===firebaseUser.uid && version===syncVersion) {
        S = mergeData(S,merged);
        S.updated = merged.updated;
        saveLocalFor(firebaseUser.uid,S);
        render();
        setSync("☁️ Google Drive merged and saved");
      }
    }).catch(e => {
      console.error("Google Drive save error:",e);
      if(user?.uid===firebaseUser.uid)
        setSync("⚠ Drive save failed; local copy retained");
    });
  },700);
}

function save(){ scheduleSave(); }

window.addEventListener("online", () => {
  if(user) scheduleSave();
});

async function authorizeGoogle(connectDriveAccess) {
  try {
    setSync(connectDriveAccess
      ? "Opening Google Drive permission..."
      : "Opening Google sign-in...");
    const selectedProvider = connectDriveAccess ? driveProvider : provider;
    const result = await signInWithPopup(auth,selectedProvider);
    await waitForAuthUser(result.user.uid);

    if(!connectDriveAccess) {
      render();
      setSync("Signed in; connect Google Drive to sync your data");
      return;
    }

    const credential = GoogleAuthProvider.credentialFromResult(result);
    if(!credential?.accessToken)
      throw new Error("Google did not return Drive access. Please try connecting again.");
    driveAccessToken = credential.accessToken;
    driveTokenExpiresAt = Date.now()+50*60*1000;
    updateDriveButtons();
    await syncDriveData(result.user);
    render();
  } catch(e) {
    console.error(e);
    if(connectDriveAccess) {
      setSync("⚠ Google Drive sync failed; local data is kept");
      message("Google Drive connection failed: " + e.message);
    } else {
      setSync("⚠ Google sign-in failed");
      message("Google sign-in failed: " + e.message);
    }
  }
}

  if(!user) {
    S = {exams:[],questions:[],codingQuestions:[],notes:[]};
    loading = false;
    render();
    setSync("Sign in required");
    return;
  }

  const local = readLocal(accountKey(user.uid));
  const oldLocal = validData(local) ? null : readLocal("examprep");
  S = normalizeData(validData(local) ? local :
    validData(oldLocal) ? oldLocal : {exams:[],questions:[]});
  if(!validData(local) && validData(oldLocal)) saveLocalFor(user.uid,S);
  loading = false;
  render();
  setSync(driveTokenValid()
    ? "Google Drive ready; sync to load latest data"
    : "Saved on this device; connect Google Drive to sync");
  for(let i=authStateWaiters.length-1;i>=0;i--) {
    if(authStateWaiters[i].owner===user.uid) {
      authStateWaiters[i].resolve();
      authStateWaiters.splice(i,1);
    }
  }
});

window.changeProfilePhoto = async function(input) {
  const file = input.files?.[0];
  if(!file) return;

  try {
    if(!file.type.startsWith("image/"))
      throw new Error("Please choose an image file.");
    if(file.size > 10*1024*1024)
      throw new Error("Image is too large. Please choose an image under 10 MB.");

    const bitmap = await createImageBitmap(file);
    try {
      const side = Math.min(bitmap.width,bitmap.height);
      if(!side) throw new Error("Could not read this image. Please choose another file.");
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      const context = canvas.getContext("2d");
      if(!context) throw new Error("Image editing is unavailable in this browser.");
      context.drawImage(bitmap,(bitmap.width-side)/2,(bitmap.height-side)/2,side,side,0,0,256,256);
      const blob = await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",0.8));
      if(!blob) throw new Error("Could not prepare the image. Please try another file.");
      if(blob.size > 200*1024)
        throw new Error("The compressed image is still too large. Please choose a simpler image.");
      const photo = await new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = () => typeof reader.result==="string"
          ? resolve(reader.result)
          : reject(new Error("Could not read the compressed image."));
        reader.onerror = () => reject(new Error("Could not read the compressed image."));
        reader.readAsDataURL(blob);
      });

      S.profilePhoto = photo;
      S.profilePhotoUpdatedAt = Date.now();
      save();
      render();
      setSync(driveTokenValid()
        ? "Profile photo saved; syncing to Google Drive..."
        : "Profile photo saved on this device; connect Google Drive to sync");
    } finally {
      bitmap.close();
    }
  } catch(e) {
    console.error("Profile photo update failed:",e);
    message("Profile photo could not be saved: "+e.message);
  } finally {
    input.value = "";
  }
};

window.useGoogleProfilePhoto = function() {
  S.profilePhoto = "";
  S.profilePhotoUpdatedAt = Date.now();
  save();
  render();
  setSync(driveTokenValid()

};

function dashboard() {
  const Q = S.questions;
  const attempted = Q.filter(q=>questionAttemptCount(q)>0).length;
  const correct = Q.filter(q=>questionAttemptCount(q)>0 && q.lastOk).length;
  const incorrect = Q.filter(q=>questionAttemptCount(q)>0 && !q.lastOk).length;
  const revise = Q.filter(q=>status(q)==="wrong"||status(q)==="revise").length;
  const chapters = S.exams.reduce((total,exam)=>total+exam.chapters.length,0);

window.formatNote = function(command,value=null) {
  const allowed = new Set([
    "bold","italic","underline","formatBlock",
    "insertUnorderedList","insertOrderedList","undo","redo","removeFormat"
  ]);
  if(!allowed.has(command)) return;
  if(command==="formatBlock" && !["p","h1","h2","h3","blockquote"].includes(value)) return;
  const editor = $("noteContent");
  if(!editor) return;
  restoreNoteSelection(editor);
  editor.focus();
  document.execCommand(command,false,value);
  window.saveNoteSelection();
};

function findNoteBlock(editor,node) {
  let element = node?.nodeType===Node.ELEMENT_NODE ? node : node?.parentElement;
  while(element && element!==editor) {
    if(/^(P|DIV|H1|H2|H3|LI|BLOCKQUOTE)$/.test(element.tagName)) return element;
    element = element.parentElement;
  }
  return null;
}

window.saveNoteSelection = function() {
  const editor = $("noteContent");
  const selection = window.getSelection();
  if(!editor || !selection?.rangeCount) return;
  const range = selection.getRangeAt(0);
  if(editor.contains(range.commonAncestorContainer))
    noteSelectionRange = range.cloneRange();
};

function restoreNoteSelection(editor) {
  const selection = window.getSelection();
  if(!noteSelectionRange || !editor.contains(noteSelectionRange.commonAncestorContainer)) {
    editor.focus();
    const range = document.createRange();
    range.selectNodeContents(editor);
    range.collapse(false);
    selection.removeAllRanges();
    selection.addRange(range);
    return false;
  }
  selection.removeAllRanges();
  selection.addRange(noteSelectionRange);
  editor.focus();
  return true;
}

window.formatNoteColor = function(command,color) {
  if(command!=="foreColor" && command!=="hiliteColor") return;
  const editor = $("noteContent");
  if(!editor) return;
  restoreNoteSelection(editor);
  document.execCommand(command,false,color);
  window.saveNoteSelection();
};

window.formatNoteHeadingColor = function(color) {
  const editor = $("noteContent");
  if(!editor || !CSS.supports("color",color)) return;
  restoreNoteSelection(editor);
  const selection = window.getSelection();
  const block = findNoteBlock(editor,selection?.anchorNode);
  if(block && /^H[1-3]$/.test(block.tagName)) {
    block.style.color = color;
  } else {
    document.execCommand("foreColor",false,color);
  }
  window.saveNoteSelection();
};

window.formatNoteFontSize = function(size) {
  if(!/^(?:12|14|16|18|24|32|40)px$/.test(size)) return;
  const editor = $("noteContent");
  if(!editor) return;
  restoreNoteSelection(editor);
  const selection = window.getSelection();
  if(!selection?.rangeCount) return;
  const range = selection.getRangeAt(0);
  if(range.collapsed) {
    const block = findNoteBlock(editor,range.startContainer);
    if(block) block.style.fontSize = size;
    window.saveNoteSelection();
    return;
  }

  const fragment = range.extractContents();
  const blocks = [...fragment.querySelectorAll("p,div,h1,h2,h3,li,blockquote")];
  if(blocks.length) {
    blocks.forEach(block=>block.style.fontSize=size);
    [...fragment.children].forEach(child=>{
      if(/^(P|DIV|H1|H2|H3|LI|BLOCKQUOTE)$/.test(child.tagName))
        child.style.fontSize = size;
    });
  } else {
    const span = document.createElement("span");
    span.style.fontSize = size;
    span.append(fragment);
    fragment.append(span);
  }

  const inserted = [...fragment.childNodes];
  range.insertNode(fragment);
  const updatedRange = document.createRange();
  if(inserted.length) {
    updatedRange.setStartBefore(inserted[0]);
    updatedRange.setEndAfter(inserted[inserted.length-1]);
    selection.removeAllRanges();
    selection.addRange(updatedRange);
  }
  window.saveNoteSelection();
};

window.formatNoteAlignment = function(alignment) {
  if(!["left","center","right"].includes(alignment)) return;
  const editor = $("noteContent");
  if(!editor) return;
  restoreNoteSelection(editor);
  const selection = window.getSelection();
  const block = findNoteBlock(editor,selection?.anchorNode);
  if(block) block.style.textAlign = alignment;
  window.saveNoteSelection();
};

async function noteImageFileDataUrl(file) {
  if(!["image/jpeg","image/png","image/webp","image/gif"].includes(file.type))
    throw new Error("Please choose a JPEG, PNG, WebP, or GIF image.");
  if(file.size > 10*1024*1024)
    throw new Error("Image is too large. Please choose an image under 10 MB.");

  let objectUrl;
  try {
    objectUrl = URL.createObjectURL(file);
    const image = new Image();
    image.src = objectUrl;
    await image.decode();
    let scale = Math.min(1,1200/Math.max(image.width,image.height));
    let blob = null;

    for(let attempt=0;attempt<8;attempt++) {
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1,Math.round(image.width*scale));
      canvas.height = Math.max(1,Math.round(image.height*scale));
      const context = canvas.getContext("2d");
      if(!context) throw new Error("Image processing is unavailable in this browser.");
      context.fillStyle = "#fff";
      context.fillRect(0,0,canvas.width,canvas.height);
      context.drawImage(image,0,0,canvas.width,canvas.height);
      blob = await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",0.78));
      if(!blob) throw new Error("This image could not be compressed.");
      if(blob && blob.size<=170*1024) break;
      scale *= 0.8;
    }

    if(!blob || blob.size>170*1024)
      throw new Error("This image could not be compressed enough. Please choose a smaller image.");
    const dataUrl = await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
    return dataUrl;
  } finally {
    if(objectUrl) URL.revokeObjectURL(objectUrl);
  }
}

async function clipboardImageDataUrl(source) {
  const dataUrlMatch = source.match(/^data:image\/(jpeg|png|webp|gif);base64,([A-Za-z0-9+/=\s]+)$/i);
  if(dataUrlMatch) {
    if(dataUrlMatch[2].length>14*1024*1024)
      throw new Error("Pasted image is too large to process.");
    const blob = await fetch(source).then(response=>response.blob());
    if(blob.size>10*1024*1024)
      throw new Error("Pasted image is too large to process.");
    return noteImageFileDataUrl(new File([blob],"pasted-image",{
      type:`image/${dataUrlMatch[1].toLowerCase()}`
    }));
  }

  if(!/^https:\/\//i.test(source)) return null;
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(),5000);
  try {
    const response = await fetch(source,{
      mode:"cors",
      credentials:"omit",
      redirect:"error",
      signal:controller.signal
    });
    if(!response.ok) return null;
    const blob = await response.blob();
    if(blob.size>10*1024*1024 ||
      !["image/jpeg","image/png","image/webp","image/gif"].includes(blob.type.toLowerCase())) return null;
    return noteImageFileDataUrl(new File([blob],"pasted-image",{
      type:blob.type.toLowerCase()
    }));
  } catch(error) {
    console.warn("Could not embed a linked clipboard image; keeping its HTTPS link.",error);
    return null;
  } finally {
    clearTimeout(timeout);
  }
}

window.insertNoteImage = async function(input) {
  const file = input.files?.[0];
  input.value = "";
  if(!file) return;

  const editor = $("noteContent");
  if(!editor) return;
  try {
    const dataUrl = await noteImageFileDataUrl(file);
    if(new Blob([editor.innerHTML,dataUrl]).size>700000)
      throw new Error("This note has reached its image and text size limit. Remove an image or shorten the note.");

    restoreNoteSelection(editor);
    const image = document.createElement("img");
    image.src = dataUrl;
    image.alt = file.name.replace(/\.[^.]+$/,"").slice(0,120);
    image.setAttribute("referrerpolicy","no-referrer");
    image.loading = "lazy";
    const selection = window.getSelection();
    if(!selection?.rangeCount) throw new Error("Click in the note where you want to insert the image.");
    const range = selection.getRangeAt(0);
    range.deleteContents();
    range.insertNode(image);
    const lineBreak = document.createElement("br");
    image.after(lineBreak);
    range.setStartAfter(lineBreak);
    range.collapse(true);
    selection.removeAllRanges();
    selection.addRange(range);
    noteSelectionRange = range.cloneRange();
  } catch(error) {
    console.error("Note image insertion failed:",error);
    message(error.message || "Could not insert this image.");
  }
};

window.handleNotePaste = async function(event) {
  const clipboard = event.clipboardData;
  const editor = $("noteContent");
  if(!clipboard || !editor) return;

  const html = clipboard.getData("text/html");
  const plainText = clipboard.getData("text/plain");
  const imageFiles = [...clipboard.items]
    .filter(item=>item.kind==="file" && item.type.startsWith("image/"))
    .map(item=>item.getAsFile())
    .filter(Boolean);
  if(!html && !imageFiles.length) return;

  event.preventDefault();
  try {
    const container = document.createElement("div");
    if(html) container.innerHTML = sanitizeNoteHtml(html,{allowLargeImages:true});
    else container.innerHTML = plainText.split(/\r?\n/)
      .map(line=>`<p>${line ? esc(line) : "<br>"}</p>`).join("");

    const clipboardImages = [...container.querySelectorAll("img")];
    for(let index=0;index<clipboardImages.length;index++) {
      const image = clipboardImages[index];
      const file = imageFiles[index];
      if(file) {
        image.src = await noteImageFileDataUrl(file);
      } else {
        const source = image.getAttribute("src")||"";
        const embedded = await clipboardImageDataUrl(source);
        if(embedded) image.src = embedded;
      }
      if(file || /^data:image\//i.test(image.getAttribute("src")||"")) {
        image.setAttribute("referrerpolicy","no-referrer");
        image.loading = "lazy";
      }
    }

    for(const file of imageFiles.slice(clipboardImages.length)) {
      const image = document.createElement("img");
      image.src = await noteImageFileDataUrl(file);
      image.alt = file.name.replace(/\.[^.]+$/,"").slice(0,120) || "Pasted image";
      image.setAttribute("referrerpolicy","no-referrer");
      image.loading = "lazy";
      container.append(image,document.createElement("br"));
    }
    container.innerHTML = sanitizeNoteHtml(container.innerHTML);

    const fragment = document.createDocumentFragment();
    while(container.firstChild) fragment.append(container.firstChild);
    if(!fragment.childNodes.length) return;

    const prospectiveContent = document.createElement("div");
    prospectiveContent.innerHTML = editor.innerHTML;
    prospectiveContent.append(fragment.cloneNode(true));
    if(new Blob([prospectiveContent.innerHTML]).size>700000)
      throw new Error("This note has reached its paste size limit. Remove an image or shorten the note.");

    restoreNoteSelection(editor);
    const selection = window.getSelection();
    if(!selection?.rangeCount)
      throw new Error("Click in the note where you want to paste the content.");
    const range = selection.getRangeAt(0);
    range.deleteContents();
    const insertedNodes = [...fragment.childNodes];
    range.insertNode(fragment);
    if(insertedNodes.length) {
      range.setStartAfter(insertedNodes[insertedNodes.length-1]);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
      noteSelectionRange = range.cloneRange();
    }
  } catch(error) {
    console.error("Pasting formatted note content failed:",error);
    message(error.message || "Could not paste this content.");
  }
};

/* ---------- BULK IMPORT ---------- */

function parseBlock(block) {
  const lines = block.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length) return null;

  let q = "", explanation = "", answer = null;
  const options = [];

  for(const line of lines) {
    let m;
    if((m=line.match(/^(?:Explanation|व्याख्या)\s*[:：-]\s*(.*)$/i))) {
      explanation = m[1]; continue;
    }
    if((m=line.match(/^(?:Correct answer|Answer|Ans|Sahi jawab|Sahi uttar|उत्तर|सही उत्तर)\s*[:：-]\s*(?:Option\s*)?([A-D])/i))) {
      answer = "ABCD".indexOf(m[1].toUpperCase()); continue;
    }
    if((m=line.match(/^(?:Option\s*)?([A-D])\s*[.)\]:-]\s*(.*)$/i))) {
      const label=m[1].toUpperCase();
      const isCorrect=/[✅✔✓]/.test(m[2]);
      if(isCorrect) answer="ABCD".indexOf(label);
      options.push({label,text:m[2].replace(/[✅✔✓]/g,"").trim()});
      continue;
    }
    if(!options.length) q += (q?" ":"") + line.replace(/^(?:(?:Question|प्रश्न)\s*)?\d+[.)]\s*/i,"");
    else options[options.length-1].text += " " + line;
  }

  if(options.length!==4 || !q.trim() || options.some((o,i)=>o.label!=="ABCD"[i]||!o.text.trim()) || answer===null) return null;
  return {q:q.trim(),opts:options.map(o=>o.text.trim()),ans:answer,exp:explanation};
}

window.previewBulk = function() {
  const raw = $("bulkText").value.trim();
  if(!raw) return message("Pehle MCQs paste karein.");

  const numberedQuestion=/^\s*\d+\s*[.)]\s+\S/m;
  const blocks = numberedQuestion.test(raw)
    ? raw.split(/(?=^\s*\d+\s*[.)]\s+\S)/m).filter(s=>s.trim())
    : raw.split(/\r?\n\s*\r?\n+/).filter(s=>s.trim());
  const parsed = blocks.map(parseBlock);

  if(!parsed.length || parsed.some(q=>!q)) {
    bulkQuestions = [];
    $("bulkPreview").innerHTML = `<p class="mu">Format samajh nahi aaya. Har question ko 1., 2. se shuru karein ya blank line se alag karein. A-D options dein, aur sahi option ke baad ✅ lagayein ya Answer: B likhein.</p>`;
    return;
  }

  bulkQuestions = parsed;
  $("bulkPreview").innerHTML = `
    <p>${parsed.length} questions ready</p>
    ${parsed.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b><p class="mu">Correct answer: ${"ABCD"[q.ans]}</p></div>`).join("")}
    <button class="pri" onclick="saveBulk()">Save all questions</button>`;
};

    <p>${esc(q.prompt)}</p>
    ${q.constraints?`<p><b>Constraints:</b> ${esc(q.constraints)}</p>`:""}
    <h4>Concept notes</h4>
    <p>${q.conceptNotes?esc(q.conceptNotes):'<span class="mu">No concept notes added.</span>'}</p>
    <details><summary>Review ${q.testCases.length} test cases</summary>
      ${q.testCases.map((testCase,index)=>`<div class="card">
        <b>Test case ${index+1}</b><p><b>Input</b></p><pre>${esc(testCase.input)}</pre>
        <p><b>Expected output</b></p><pre>${esc(testCase.expected)}</pre>
      </div>`).join("")}
    </details>
    <details><summary>Review code drafts</summary>
      ${CODE_LANGUAGES.map(([id,label])=>q.solutions[id]
        ? `<h4>${label}</h4><pre><code>${esc(q.solutions[id])}</code></pre>`
        : "").join("") || '<p class="mu">No code drafts saved.</p>'}
    </details>
    <div class="row">
      ${btn("Edit notes / code / test cases",`editCodingQuestion('${q.id}')`)}
      ${btn("Remove from revision",`toggleCodingRevision('${q.id}')`)}
    </div>
  </div>`;
}

function codingRevisionPage() {
  const questions = S.codingQuestions.filter(q=>q.revise);
  return `<div class="card">
    <b>Coding revision</b>
    <p class="mu">Marked coding questions ke concept notes, code drafts aur expected test cases yahan review karein.</p>
    <span>${questions.length} questions for revision</span>
  </div>${questions.map(codingRevisionCard).join("") ||
    '<div class="card">Koi coding question revision ke liye mark nahi hai. Coding section mein “Mark for revision” use karein.</div>'}`;
}

/* ---------- QUESTION BANK / FILTERS ---------- */

function filteredQuestions() {
  return S.questions.filter(q=>{
    if(filter.exam && q.examId!==filter.exam) return false;
    if(filter.chapter && q.chapterId!==filter.chapter) return false;
    if(filter.topic && q.topicId!==filter.topic) return false;
    if(filter.status==="bm" && !q.bm) return false;
    if(filter.status==="attempted" && !questionAttemptCount(q)) return false;
    if(["new","wrong","revise","done"].includes(filter.status) && status(q)!==filter.status) return false;
    const haystack = (q.q+" "+q.note+" "+q.src).toLowerCase();
    if(filter.q && !haystack.includes(filter.q.toLowerCase())) return false;
    return true;
  });
}

function filterControls() {
  const selectedExam=getExam(filter.exam);
  const chapters=selectedExam ? selectedExam.chapters : [];
  const selectedChapter=chapters.find(c=>c.id===filter.chapter);
  const topics=selectedChapter ? (selectedChapter.topics||[]) : [];
  return `<div class="card">
    <label>Exam filter</label><select id="filterExam" onchange="changeFilter('exam',this.value)">
      <option value="">All exams</option>
      ${S.exams.map(e=>`<option value="${e.id}" ${filter.exam===e.id?"selected":""}>${esc(e.name)}</option>`).join("")}
    </select>
    <label>Chapter filter</label><select id="filterChapter" ${filter.exam?"":"disabled"} onchange="changeFilter('chapter',this.value)">
      <option value="">All chapters</option>
      ${chapters.map(c=>`<option value="${c.id}" ${filter.chapter===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}
    </select>
    <label>Topic filter</label><select id="filterTopic" ${filter.chapter?"":"disabled"} onchange="changeFilter('topic',this.value)">
      <option value="">All topics</option>
      ${topics.map(t=>`<option value="${t.id}" ${filter.topic===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}
    </select>
    <label>Status filter</label><select id="filterStatus" onchange="changeFilter('status',this.value)">
      ${[["","All status"],["new","Not attempted"],["attempted","Attempted"],["wrong","Incorrect"],["revise","Revise again"],["done","Correct"],["bm","Bookmarked"]].map(([v,l])=>`<option value="${v}" ${filter.status===v?"selected":""}>${l}</option>`).join("")}
    </select>
    <label>Search questions</label><input value="${esc(filter.q)}" placeholder="Search question, notes or source" onchange="changeFilter('q',this.value)">
  </div>`;
}
window.changeFilter = (key,value) => {
  filter[key] = value;
  if(key==="exam") {
    filter.chapter="";
    filter.topic="";
  } else if(key==="chapter") {
    filter.topic="";
  }
  render();
};

function bankPage() {
  const list = filteredQuestions();
  let h = filterControls()+`<div class="row"><span class="mu">${list.length} questions</span>
    ${list.length?btn("Practice these","startPractice()","pri"):""}</div>`;

  list.forEach(q=>{
    h += `<div class="card">
      <b>${esc(q.q)}</b>
      <div class="row" style="margin-top:8px">
        <span class="tag">${esc(questionLocation(q))}</span>
        <span class="tag">${STATUS[status(q)]}</span>
        ${q.src?`<span class="tag">${esc(q.src)}</span>`:""}
        <span class="tag">Attempts: ${questionAttemptCount(q)}</span>
      </div>
      <div class="row" style="margin-top:8px">
        ${btn(q.bm?"★ Bookmarked":"☆ Bookmark",`toggleBookmark('${q.id}')`)}
        ${btn("Edit",`editQuestion('${q.id}')`)}
        ${btn("Delete",`deleteQuestion('${q.id}')`,"del")}
      </div>
    </div>`;
  });

  return h;
}

window.toggleBookmark = id => {
  const q = S.questions.find(q=>q.id===id);
  if(!q) return;
  q.bm = !q.bm;stamp(q);save();render();
};
window.editQuestion = id => {
  editId = id;pre = null;go("add");
};
window.deleteQuestion = id => confirmAction("Delete this question?",()=>{
  markDeleted("questions",id);
  S.questions = S.questions.filter(q=>q.id!==id);
  save();render();
});

/* ---------- PRACTICE ---------- */

window.startPractice = function() {
  practice = {ids:filteredQuestions().map(q=>q.id),index:0,picked:null};
  go("prac");
};
window.startPracticeIds = ids => {
  practice = {ids,index:0,picked:null};
  go("prac");
};

function practicePage() {
  if(!practice.ids.length) {
    return `<div class="card">Question Bank mein questions add karein, phir Practice start karein.</div>`;
  }

  const q = S.questions.find(q=>q.id===practice.ids[practice.index]);
  if(!q) return `<div class="card">Question not found.</div>`;

  let h = `<p class="mu">Question ${practice.index+1} / ${practice.ids.length}</p>
    <div class="card">
    <span class="tag">${esc(questionLocation(q))}</span>
    <p><b>${esc(q.q)}</b></p>`;

  q.opts.forEach((o,i)=>{
    let cls = "";
    if(practice.picked!==null) {
      if(i===q.ans) cls=" ok";
      else if(i===practice.picked) cls=" bad";
    }
    h += `<button class="opt${cls}" ${practice.picked!==null?"disabled":""} onclick="pickAnswer(${i})">${"ABCD"[i]}. ${esc(o)}</button>`;
  });

  if(practice.picked!==null) {
    const correct = practice.picked===q.ans;
    h += `<p style="color:var(--${correct?"ok":"no"})"><b>${correct?"Correct ✓":"Incorrect ✗"} — Answer: ${"ABCD"[q.ans]}</b></p>`;
    if(q.exp) h += `<p>${esc(q.exp)}</p>`;
    h += `<label>My notes</label><textarea id="practiceNote">${esc(q.note)}</textarea>
      <div class="row">
        <button onclick="savePracticeNote()">Save note</button>
        ${btn(q.revise?"✓ Marked for revision":"Mark for revision",`toggleRevision('${q.id}')`)}
        ${btn(q.bm?"★ Bookmarked":"☆ Bookmark",`toggleBookmark('${q.id}')`)}
        ${btn(practice.index+1<practice.ids.length?"Next →":"Finish", "nextPractice()","pri")}
      </div>`;
  }

  return h+"</div>";
}

window.pickAnswer = function(i) {
  if(practice.picked!==null) return;
  const q = S.questions.find(q=>q.id===practice.ids[practice.index]);
  if(!q) return;

  practice.picked = i;
  const correct = i===q.ans;
  recordQuestionAttempt(q,correct);
  save();render();
};

window.savePracticeNote = function() {
  const q = S.questions.find(q=>q.id===practice.ids[practice.index]);
  if(q) {
    q.note = $("practiceNote").value.trim();
    stamp(q);
    save();message("Note saved.");
  }
};

window.toggleRevision = id => {
  const q = S.questions.find(q=>q.id===id);
  if(q) {
    q.revise = !q.revise;
    stamp(q);
    save();render();
  }
};

window.nextPractice = function() {
  if(practice.index+1 < practice.ids.length) {
    practice.index++;
    practice.picked = null;
    render();
  } else {
    practice = {ids:[],index:0,picked:null};
    go("dash");
  }
};

/* ---------- REVISION ---------- */

window.setRevisionFilter = function(field,value) {
  revisionFilter[field]=value;
  if(field==="exam") {
    revisionFilter.chapter="";
    revisionFilter.topic="";
  } else if(field==="chapter") {
    revisionFilter.topic="";
  }
  render();
};

function revisionPage() {
  const revisionQuestions=S.questions.filter(q=>status(q)==="wrong"||status(q)==="revise");
  const exams=S.exams.filter(e=>revisionQuestions.some(q=>q.examId===e.id));
  const selectedExam=exams.find(e=>e.id===revisionFilter.exam);
  const chapters=selectedExam
    ? selectedExam.chapters.filter(c=>revisionQuestions.some(q=>q.examId===selectedExam.id&&q.chapterId===c.id))
    : [];
  const selectedChapter=chapters.find(c=>c.id===revisionFilter.chapter);
  const topics=selectedExam&&selectedChapter
    ? (selectedChapter.topics||[]).filter(t=>revisionQuestions.some(q=>q.examId===selectedExam.id&&q.chapterId===selectedChapter.id&&q.topicId===t.id))
    : [];

  if(revisionFilter.exam&&!selectedExam) revisionFilter={exam:"",chapter:"",topic:""};
  else if(revisionFilter.chapter&&!selectedChapter) {
    revisionFilter.chapter="";
    revisionFilter.topic="";
  } else if(revisionFilter.topic&&!topics.some(t=>t.id===revisionFilter.topic)) {
    revisionFilter.topic="";
  }

  const list=revisionQuestions.filter(q=>
    (!revisionFilter.exam||q.examId===revisionFilter.exam)&&
    (!revisionFilter.chapter||q.chapterId===revisionFilter.chapter)&&
    (!revisionFilter.topic||q.topicId===revisionFilter.topic)
  );
  let h=`<div class="card">
    <b>Revision ko chun kar practice karein</b>
    <label>Exam</label>
    <select id="revisionExam" onchange="setRevisionFilter('exam',this.value)">
      <option value="">All exams</option>
      ${exams.map(e=>`<option value="${esc(e.id)}" ${revisionFilter.exam===e.id?"selected":""}>${esc(e.name)}</option>`).join("")}
    </select>
    <label>Chapter</label>
    <select id="revisionChapter" ${revisionFilter.exam?"":"disabled"} onchange="setRevisionFilter('chapter',this.value)">
      <option value="">All chapters</option>
      ${chapters.map(c=>`<option value="${esc(c.id)}" ${revisionFilter.chapter===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}
    </select>
    <label>Topic</label>
    <select id="revisionTopic" ${revisionFilter.chapter?"":"disabled"} onchange="setRevisionFilter('topic',this.value)">
      <option value="">All topics</option>
      ${topics.map(t=>`<option value="${esc(t.id)}" ${revisionFilter.topic===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}
    </select>
    <div class="row"><span class="mu">${list.length} questions for revision</span>
      ${list.length?btn("Practice selected","startPracticeIds("+JSON.stringify(list.map(q=>q.id))+")","pri"):""}
    </div>
  </div>`;

  if(!revisionQuestions.length) return h+`<div class="card">Abhi revision ke liye questions nahi hain. Practice mein galat jawab dein ya question par “Mark for revision” dabayein.</div>`;
  if(!list.length) return h+`<div class="card">Is selection mein revision questions nahi hain.</div>`;
  h+=`<div class="card"><b>Selected revision questions</b>`;
  list.forEach(q=>{
    h+=`<div style="padding:10px 0;border-top:1px solid var(--bd)">
      <div>${esc(q.q)}</div>
      <div class="row"><span class="tag">${esc(questionLocation(q)||"Uncategorized")}</span>
        <span class="tag">${STATUS[status(q)]}</span>
        ${btn("Practice",`startPracticeIds(['${q.id}'])`)}
        ${btn(q.revise?"Unmark revision":"Mark revision",`toggleRevision('${q.id}')`)}
      </div>
    </div>`;
  });
  return h+`</div>`;
}

/* ---------- SETTINGS ---------- */

function settingsPage() {
  return `<div class="card">
    <h3>Account</h3>
    <p>${esc(user?.email||"")}</p>
    <p class="mu">Questions aapke browser mein local copy aur aapke Google Drive mein ${DRIVE_FILE_NAME} ke roop mein save hote hain.</p>
    ${driveTokenValid()
      ? btn("Sync now / merge devices","syncDriveNow()")
      : btn("Connect Google Drive","connectDrive()","pri")}
    <button class="pri" onclick="loginBtn()">Sign out</button>
  </div>
  <div class="card">
    <h3>Appearance</h3>
    <button onclick="toggleTheme()">Toggle light / dark theme</button>
  </div>
  <div class="card">
    <h3>Data backup</h3>
    <p class="mu">Har device par Google Drive connect karke Sync now karein. App local aur Drive data merge karega; alag devices ke practice attempts judenge. Ek hi question ya note ko dono devices par alag edit karne par latest edit rakha jayega. Drive file delete ho jaaye, tab bhi is browser ki local copy se Sync now par nayi Drive file ban sakti hai.</p>
    <button onclick="exportData()">Download backup</button>
    <button onclick="document.getElementById('imp').click()">Restore backup</button>
  </div>`;
}

window.toggleTheme = function() {
  document.documentElement.dataset.theme =
    document.documentElement.dataset.theme==="dark" ? "light" : "dark";
};

/* ---------- EXPORT / RESTORE ---------- */

window.exportData = function() {
  if(!user) return message("Pehle sign in karein.");
  const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "exam-prep-backup.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

window.importData = function(input) {
  const file = input.files[0];
  if(!file) return;

  file.text().then(text=>{
    const data = JSON.parse(text);
    if(!validData(data)) throw new Error("Invalid backup");
    confirmAction("Backup ka data current questions, notes aur progress ke saath merge hoga. Restore karein?",()=>{
      S = mergeData(S,data);
      save();render();
      setSync("Backup merged; syncing...");
    });
  }).catch(()=>{
    message("Backup file valid nahi hai.");
  }).finally(()=>{
    input.value = "";
  });
};

/* ---------- INITIAL RENDER ---------- */

render();
</script>
